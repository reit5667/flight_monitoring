[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-monitor"
version = "0.1.0"
description = "Flight Price Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.44",
    "httpx>=0.27",
    "orjson>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg2-binary>=2.9",
    "prefect>=2.19",
    "prometheus-client>=0.20",
    "python-telegram-bot>=21.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "connectors*",
    "planner*",
    "parser*",
    "models*",
    "cdc*",
    "warehouse*",
    "storage*",
    "scheduler*",
    "notifications*",
    "metrics*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: live integration tests that hit real external services (network required)",
]
