services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  prefect-server:
    image: prefecthq/prefect:2-python3.12
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prefect-worker:
    image: prefecthq/prefect:2-python3.12
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    # pip install is fast on repeat runs because the image layer is cached;
    # the install is needed so the worker can import our project modules when executing flows.
    command: >
      bash -c "pip install -e /app --quiet --no-deps 2>/dev/null;
               pip install psycopg2-binary httpx orjson pydantic pydantic-settings python-dotenv --quiet 2>/dev/null;
               prefect worker start --pool default-agent-pool --type process"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRAVELPAYOUTS_TOKEN: ${TRAVELPAYOUTS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

volumes:
  postgres_data:
